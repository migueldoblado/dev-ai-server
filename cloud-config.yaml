#cloud-config

packages:
  - pass
  - gnupg
  - git
  - curl
  - zsh
  - docker.io
  - build-essential
  - jq

runcmd:
  # Ubuntu image forces a root password change on first SSH — reset expiry
  - chage -d -1 root
  # Node 22 via NodeSource (Ubuntu's nodejs v18 is too old for pi)
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  # rtk — LLM context filter (needs explicit HOME, runcmd has none)
  - export HOME=/root; curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh
  # chezmoi — dotfiles manager
  - curl -fsSL https://git.io/chezmoi | sh -s -- -b /usr/local/bin
  # herdr — agent multiplexer (needs explicit HOME)
  - export HOME=/root; curl -fsSL https://herdr.dev/install.sh | sh
  # pi — coding agent
  - npm install -g @earendil-works/pi-coding-agent
  # zsh as default shell
  - command -v zsh >> /etc/shells 2>/dev/null || true; chsh -s /usr/bin/zsh root

users:
  - name: root
    shell: /usr/bin/zsh
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBVA7AVX0xYKkja/CXPAEWtzukbEilaW4JeM04EzBki3 hetzner-dev

final_message: "Boot complete. SSH in for manual setup — see dev-ai-server README."