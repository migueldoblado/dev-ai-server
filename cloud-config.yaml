#cloud-config

# Login user is ai-dev, not root. Name must match DEV_USER in bin/dev-ai-server-up.
disable_root: true

packages:
  - pass
  - gnupg
  - git
  - curl
  - zsh
  - docker.io
  - nodejs
  - npm
  - build-essential
  - jq

users:
  - name: ai-dev
    shell: /usr/bin/zsh
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    groups: [sudo, docker]
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBVA7AVX0xYKkja/CXPAEWtzukbEilaW4JeM04EzBki3 hetzner-dev

runcmd:
  # rtk and herdr install into $HOME/.local/bin; runcmd has no HOME
  - runuser -u ai-dev -- sh -c 'curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh'
  - curl -fsSL https://git.io/chezmoi | sh -s -- -b /usr/local/bin
  - runuser -u ai-dev -- sh -c 'curl -fsSL https://herdr.dev/install.sh | sh'
  - npm install -g @earendil-works/pi-coding-agent
  # users_groups runs before packages, so zsh may not exist yet at user creation
  - command -v zsh >> /etc/shells 2>/dev/null || true; chsh -s /usr/bin/zsh ai-dev
  # Hetzner image allows root SSH with a password. Block it.
  - printf '%s\n' 'PermitRootLogin no' > /etc/ssh/sshd_config.d/99-no-root.conf
  - systemctl reload ssh

final_message: "Boot complete. SSH in as ai-dev — see dev-ai-server README."
